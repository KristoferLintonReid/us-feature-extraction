[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "usfeat"
version = "0.1.0"
description = "Multi-family feature extraction for 2D ultrasound: TexLab, PyRadiomics, DINOv2/v3, BiomedCLIP, SigLIP, ImageNet"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "tifffile>=2023.4",
    "openpyxl>=3.1",
    "SimpleITK>=2.2",
    "pyradiomics>=3.1",
    "torch>=2.0",
    "timm>=1.0",
    "transformers>=4.40",
    "open_clip_torch>=2.24",
    "cryptography>=42.0",
    "opencv-python-headless>=4.8",
    "scipy>=1.10",
    "tqdm>=4.65",
]

[project.scripts]
usfeat = "usfeat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
usfeat = ["py.typed"]
